<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tiny Tides - A cozy 2D indie fishing game. Explore the ocean, catch rare fish, upgrade your gear, and uncover the secrets of the sea.">
    <title>Tiny Tides</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <!-- Loading Screen -->
        <div id="loading-screen" class="screen active">
            <div class="loading-waves">
                <div class="wave wave-1"></div>
                <div class="wave wave-2"></div>
                <div class="wave wave-3"></div>
            </div>
            <h1 class="title">Tiny Tides</h1>
            <p class="subtitle">A Cozy Fishing Adventure</p>
            <p class="loading-text">Generating ocean...</p>
            <div class="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
        </div>

        <!-- Main Menu -->
        <div id="main-menu" class="screen">
            <div class="menu-bg"></div>
            <h1 class="title">Tiny Tides</h1>
            <div class="menu-buttons">
                <button id="btn-continue">Continue</button>
                <button id="btn-story">Story Mode</button>
                <button id="btn-free-roam">Free Roam</button>
                <button id="btn-options">Options</button>
            </div>
            <p class="menu-footer">WASD/Arrows: Move | SPACE: Fish | E: Interact | I: Items | Q: Quests</p>
        </div>

        <!-- Game UI Overlay (HUD buttons are now drawn on canvas) -->
        <div id="game-ui" class="screen">
        </div>

        <!-- The Game Canvas -->
        <canvas id="game-canvas"></canvas>
    </div>

    <script src="js/main.js" type="module"></script>
</body>
</html>
